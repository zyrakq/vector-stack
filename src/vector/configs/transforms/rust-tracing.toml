[sources.file.multiline]
start_pattern = '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}\s+\w+\s+request'
mode = "halt_before"
condition_pattern = '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}\s+\w+\s+request'
timeout_ms = 2000

[transforms.rust_tracing]
type = "lua"
inputs = ["json"]
version = "2"
hooks.process = "process"
source = '''
function get_priority_level(levels)
    local priority_map = {
        ERROR = 5,
        WARN = 4,
        INFO = 3,
        DEBUG = 2,
        TRACE = 1
    }
    
    local max_priority = 0
    local max_level = "INFO"
    
    for _, level in ipairs(levels) do
        local upper_level = level:upper()
        local priority = priority_map[upper_level] or 0
        if priority > max_priority then
            max_priority = priority
            max_level = upper_level
        end
    end
    
    return max_level
end

function process(event, emit)
    local log = event.log
    
    if not log.origin_message then
        log.origin_message = log.message
    end
    
    log.parse_success = false
    log.parse_count = 0
    log.nested_iterations = 0
    log.levels = {}
    
    if not parse_request_metadata(log) then
        emit(event)
        return
    end
    
    local lines = {}
    for line in string.gmatch(log.origin_message, "[^\n]+") do
        table.insert(lines, line)
    end
    
    if #lines >= 2 then
        parse_kv_pairs(log, lines[1], lines[2])
    elseif #lines == 1 then
        parse_kv_pairs(log, lines[1], nil)
    end
    
    if #lines > 2 then
        local nested_lines = {}
        for i = 3, #lines do
            table.insert(nested_lines, lines[i])
        end
        process_nested_structure(log, nested_lines)
    end
    
    if #log.levels > 0 then
        log.level = get_priority_level(log.levels)
    end
    
    log.message = nil
    emit(event)
end

function parse_request_metadata(log)
    local first_line = log.origin_message:match("^[^\n]+")
    if not first_line then
        return false
    end
    
    local request_id, level = first_line:match("^([a-f0-9%-]+)%s+(%w+)%s+")
    if request_id and level then
        log.request_id = request_id
        table.insert(log.levels, level)
        return true
    end
    
    return false
end

function parse_brackets_content(log, field_name, brackets_content)
    if not brackets_content or brackets_content == "" then
        return
    end
    
    local values = {}
    for value in string.gmatch(brackets_content, "[^|]+") do
        local value_str = value:gsub("^%s*(.-)%s*$", "%1")
        if value_str ~= "" then
            table.insert(values, value_str)
        end
    end
    
    if #values == 2 then
        log[field_name .. "_duration"] = values[1]
        log[field_name .. "_percentage"] = values[2]
        log.parse_count = (log.parse_count or 0) + 2
        log.parse_success = true
    else
        for idx, value in ipairs(values) do
            local field_key = field_name .. "_" .. tostring(idx - 1)
            log[field_key] = value
            log.parse_count = (log.parse_count or 0) + 1
            log.parse_success = true
        end
    end
end

function extract_kv_pairs(log, content, field_prefix)
    if not content or content == "" then
        return
    end
    
    for part in string.gmatch(content, "[^|]+") do
        local part_str = part:gsub("^%s*(.-)%s*$", "%1")
        if part_str ~= "" then
            local key, value = part_str:match("^([^:]+):%s*(.+)$")
            if key and value then
                key = key:gsub("^%s*(.-)%s*$", "%1")
                value = value:gsub("^%s*(.-)%s*$", "%1")
                if key ~= "" then
                    local field_key = field_prefix .. "_" .. key
                    log[field_key] = value
                    log.parse_count = (log.parse_count or 0) + 1
                    log.parse_success = true
                end
            else
                local msg_key = field_prefix .. "_level_msg"
                if not log[msg_key] and part_str ~= "" then
                    local trimmed_msg = part_str:gsub("%s+$", "")
                    log[msg_key] = trimmed_msg
                end
            end
        end
    end
end

function parse_kv_pairs(log, first_line, second_line)
    local field_name, brackets_content, rest = first_line:match("^%S+%s+%w+%s+([a-zA-Z_][a-zA-Z0-9_]*)%s*%[([^%]]+)%](.*)$")
    
    if field_name then
        parse_brackets_content(log, field_name, brackets_content)
        
        if rest and rest ~= "" then
            extract_kv_pairs(log, rest, field_name)
        end
    end
    
    if second_line then
        local marker_level = second_line:match("ｉ%s*%[(%w+)%]")
        if marker_level then
            log[field_name .. "_level"] = marker_level
            
            local marker_end = second_line:find("]:")
            if marker_end then
                local content = second_line:sub(marker_end + 2)
                if content and content ~= "" then
                    extract_kv_pairs(log, content, field_name)
                end
            end
        end
    end
end

function count_depth(prefix)
    local indent_match = prefix:match("^([│%s]*)[┕┝]━")
    if indent_match then
        local _, pipe_count = indent_match:gsub("│", "")
        local _, space_count = indent_match:gsub(" ", "")
        
        local extra_spaces = space_count - (pipe_count * 2)
        local extra_depth = math.floor(extra_spaces / 3)
        
        return pipe_count + extra_depth
    end
    
    return 0
end

function parse_line(line)
    local request_id, level, prefix, field_name, brackets, rest =
        line:match("^([a-f0-9%-]+)%s+(%w+)%s+([│%s]*[┕┝]━)%s+([a-zA-Z_][a-zA-Z0-9_]*)%s*%[([^%]]+)%](.*)$")
    
    if field_name then
        return {
            type = "field",
            request_id = request_id,
            level = level,
            prefix = prefix,
            field_name = field_name,
            brackets = brackets,
            rest = rest,
            depth = count_depth(prefix)
        }
    end
    
    local request_id2, level2, prefix2, marker_level, content =
        line:match("^([a-f0-9%-]+)%s+(%w+)%s+([│%s]*[┕┝]━)%s+.-%[(%w+)%]:(.*)$")
    
    if marker_level then
        return {
            type = "marker",
            request_id = request_id2,
            level = level2,
            prefix = prefix2,
            marker_level = marker_level,
            content = content,
            depth = count_depth(prefix2)
        }
    end
    
    return nil
end

function process_nested_structure(log, lines)
    for _, line in ipairs(lines) do
        local request_id, level = line:match("^([a-f0-9%-]+)%s+(%w+)%s+")
        if request_id and level then
            table.insert(log.levels, level)
        end
    end
    
    local max_iterations = 10
    local iteration = 0
    
    while iteration < max_iterations do
        local pairs_found = false
        local max_pair_depth = 0
        
        for i = 1, #lines - 1 do
            local parsed1 = parse_line(lines[i])
            local parsed2 = parse_line(lines[i + 1])
            
            if parsed1 and parsed1.type == "field" and
               parsed2 and parsed2.depth >= parsed1.depth then
                pairs_found = true
                if parsed2.depth > max_pair_depth then
                    max_pair_depth = parsed2.depth
                end
            end
        end
        
        if not pairs_found then
            break
        end
        
        local new_lines = {}
        local i = 1
        
        while i <= #lines do
            local pair_extracted = false
            
            if i < #lines then
                local parsed1 = parse_line(lines[i])
                local parsed2 = parse_line(lines[i + 1])
                
                if parsed1 and parsed1.type == "field" and
                   parsed2 and parsed2.depth == max_pair_depth and
                   parsed2.depth >= parsed1.depth then
                       
                     local field_prefix = parsed1.field_name
                     
                     parse_brackets_content(log, field_prefix, parsed1.brackets)
                     
                     if parsed1.rest and parsed1.rest ~= "" then
                         extract_kv_pairs(log, parsed1.rest, field_prefix)
                     end
                     
                     if parsed2.type == "marker" then
                         log[field_prefix .. "_level"] = parsed2.marker_level
                         
                         local content = parsed2.content:gsub("^%s*(.-)%s*$", "%1")
                         
                         if content:find("|") then
                             for kv in string.gmatch(content, "[^|]+") do
                                 local key, value = kv:match("^%s*([^:]+):%s*(.+)%s*$")
                                 if key and value then
                                     key = key:gsub("^%s*(.-)%s*$", "%1")
                                     value = value:gsub("^%s*(.-)%s*$", "%1")
                                     log[field_prefix .. "_" .. key] = value
                                     log.parse_count = (log.parse_count or 0) + 1
                                     log.parse_success = true
                                 else
                                     local msg = kv:match("^%s*(.+)%s*$")
                                     if msg and msg ~= "" then
                                         local trimmed_msg = msg:gsub("%s+$", "")
                                         log[field_prefix .. "_level_msg"] = trimmed_msg
                                         log.parse_count = (log.parse_count or 0) + 1
                                         log.parse_success = true
                                     end
                                 end
                             end
                         else
                             if content ~= "" then
                                 local trimmed_msg = content:gsub("%s+$", "")
                                 log[field_prefix .. "_level_msg"] = trimmed_msg
                                 log.parse_count = (log.parse_count or 0) + 1
                                 log.parse_success = true
                             end
                         end
                     end
                     
                     pair_extracted = true
                     i = i + 2
                end
            end
            
            if not pair_extracted then
                table.insert(new_lines, lines[i])
                i = i + 1
            end
        end
        
        lines = new_lines
        iteration = iteration + 1
    end
    
    log.nested_iterations = iteration
end
'''
