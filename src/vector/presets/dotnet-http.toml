# dotnet-http
## combo: "http", "json-batch", "multiline"
## sink: "openobserve"
[sources.http]
type = "http_server"
address = "0.0.0.0:8080"
path = "/logs"
method = "POST"
headers = ["Content-Type"]
auth.strategy = "basic"
auth.username = "app-user"
auth.password = "VDdXH2a7FkW7gw5zbdce8OvOlQ1LqlhF"
decoding.codec = "bytes"
framing.method = "bytes"

[transforms.json_batch]
type = "remap"
inputs = ["http"]
drop_on_error = true
source = '''
message_data = parse_json!(string!(.message))

if is_array(message_data) {
    array_length = length!(message_data)
    if array_length > 0 {
        .parsed_array = message_data
        .array_total = array_length
    } else {
        abort
    }
} else {
    .parsed_array = [message_data]
    .array_total = 1
}
'''

[transforms.multiline_generate]
type = "lua"
inputs = ["json_batch"]
version = "2"
hooks.process = "process"
source = '''
function process(event, emit)
    local log = event.log

    if not log.parsed_array then
        return
    end

    for i, item in ipairs(log.parsed_array) do
        local new_event = {log = {}}

        if type(item) == "table" then
            for k, v in pairs(item) do
                new_event.log[k] = v
            end
        else
            new_event.log.message = tostring(item)
        end

        new_event.log.array_index = i - 1
        new_event.log.array_total = log.array_total
        new_event.log.split_from_array = true

        emit(new_event)
    end
end
'''

[transforms.multiline]
type = "remap"
inputs = ["multiline_generate"]
source = '''
if exists(."@i") {
    .id = del(."@i")
}

if exists(."@l") {
    .level = del(."@l")
}

if exists(."@mt") {
    .message_template = del(."@mt")
}

if exists(."@m") {
    .message = del(."@m")
}

if exists(."@t") {
    .timestamp = del(."@t")
}

if exists(."_i") {
    .id = del(."_i")
}

if exists(."_l") {
    .level = del(."_l")
}

if exists(."_mt") {
    .message_template = del(."_mt")
}

if exists(."_m") {
    .message = del(."_m")
}

if exists(."_t") {
    .timestamp = del(."_t")
}
'''
