x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
services:
  vector:
    container_name: vector
    image: ${IMAGE:-"localhost/vector-geoip-alpine:latest"}
    restart: unless-stopped
    logging: *default-logging
    environment:
      VECTOR_CONFIG_DIR: ${VECTOR_CONFIG_DIR:-/etc/vector/configs}
      GEOIP_SOURCE: ${GEOIP_SOURCE:-"geolite2-city"}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vector-data:${VECTOR_CONFIG_DIR:-/etc/vector/configs}
      - geoip:/etc/vector/geoip
    ports:
      - ${PORT:-8080}:${PORT:-8080}
volumes:
  vector-data:
    name: ${VECTOR_DATA:-vector-data}
    external: ${VECTOR_DATA_EXTERNAL:-false}
  geoip:
    name: geoip
