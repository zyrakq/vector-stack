data_dir = "/tmp/vector_data"

[sources.file]
type = "file"
include = ["input.log"]

[transforms.easytier]
type = "remap"
inputs = ["file"]

source = '''
.original_message = .message

parsed, err = parse_regex(
    .message,
    r'^\d{4}-\d{2}-\d{2}T[\d:.]+Z\s+(?P<level>[A-Z]+)\s+(?P<module>[\w:]+):\s+(?:\[(?P<uuid>[^\]]+)\]\s+)?(?P<parsed_message>.*)$'
)

if is_null(parsed) {
    .level = "UNKNOWN"
    .module = "unparsed"
} else {
    .level  = parsed.level
    .module = parsed.module
    .uuid   = parsed.uuid

    .parsed_message = parsed.parsed_message
}
'''


[sinks.stdout]
type = "console"
inputs = ["easytier"]
encoding.codec = "json"
